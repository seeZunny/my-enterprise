<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เอกสาร · My Enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="toaster"></div>
<div id="mob-ov" class="mob-ov" onclick="closeMobDrawer()"></div>

<!-- Mobile drawer -->
<aside id="mob-drawer">
  <div class="md-head">
    <div style="width:34px;height:34px;border-radius:8px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:italic;font-size:18px">m</div>
    <div><div style="font-weight:600;font-size:14px" id="md-name">My Enterprise</div><div style="font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em">ระบบเอกสาร</div></div>
  </div>
  <div id="md-nav"></div>
</aside>

<div id="app">
  <!-- TOP NAV -->
  <header id="topnav">
    <div class="tn-inner">
      <button class="hamburger" onclick="toggleMobDrawer()" aria-label="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="tn-brand" onclick="navigate('dashboard')">
        <div class="tn-mark">m</div>
        <div>
          <div class="tn-brand-name" id="tn-brand-name">My Enterprise</div>
          <div class="tn-brand-sub">ระบบเอกสาร</div>
        </div>
      </div>
      <nav class="tn-nav" id="tn-nav"></nav>
      <div class="tn-actions">
        <button class="btn-cmdk" onclick="openCmdK()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span>ค้นหา · สร้าง</span>
          <span class="kbd">⌘K</span>
        </button>
        <div style="position:relative" id="create-wrap">
          <button class="btn-create" onclick="toggleCreateMenu()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg>
            <span class="bc-label">สร้างเอกสาร</span>
          </button>
          <div id="create-menu" style="display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--paper);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow-lg);min-width:240px;z-index:60;padding:6px;animation:cmdkIn .2s"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <div id="main">
    <main id="content">
      <div style="padding:80px;text-align:center;color:var(--ink-3)">
        <div class="spin" style="width:24px;height:24px;border-width:3px"></div>
        <div style="margin-top:14px">กำลังเตรียมระบบ...</div>
      </div>
    </main>
  </div>
</div>

<script src="icons.js"></script>
<script src="core.js"></script>
<script src="forms.js"></script>
<script src="print.js"></script>
<script src="app.js"></script>
<script src="cmdk.js"></script>
<script>
// ============================================================
// REPAIR + INIT
// ============================================================
async function repairCounters(){
  const thYear=new Date().getFullYear()+543;
  for(const type of ['quotation','invoice','receipt','billing']){
    const realMax=await getMaxDocCount(type,thYear);
    const ctr=await dbGet('doc_counters',type);
    if(!ctr||ctr.year!==thYear||ctr.count!==realMax){
      await dbPut('doc_counters',{type,count:realMax,year:thYear});
    }
  }
}

async function seedIfEmpty(){
  const[c,i]=await Promise.all([dbAll('customers'),dbAll('inventory')]);
  if(c.length===0){
    await dbAdd('customers',{name:'บริษัท ตัวอย่าง จำกัด',taxId:'0105561234567',address:'123 ถ.พระราม 4 แขวงทุ่งมหาเมฆ เขตสาทร กรุงเทพ 10120',phone:'02-000-0000',email:'sample@example.com',note:'',createdAt:new Date().toISOString()});
    await dbAdd('customers',{name:'ห้างหุ้นส่วน พันธมิตร จำกัด',taxId:'0103564002345',address:'456 ถ.สุขุมวิท 21 แขวงคลองเตยเหนือ เขตวัฒนา กรุงเทพ 10110',phone:'02-111-2222',email:'partner@example.com',note:'',createdAt:new Date().toISOString()});
  }
  if(i.length===0){
    await dbAdd('inventory',{name:'บริการที่ปรึกษา (รายชั่วโมง)',sku:'CON-HR',category:'บริการ',unit:'ชม.',stock:999,price:1500,cost:0,description:'',createdAt:new Date().toISOString()});
    await dbAdd('inventory',{name:'ค่าออกแบบกราฟิก',sku:'DSG-01',category:'บริการ',unit:'งาน',stock:999,price:8500,cost:0,description:'',createdAt:new Date().toISOString()});
    await dbAdd('inventory',{name:'กล่องบรรจุภัณฑ์ ขนาด M',sku:'PKG-M',category:'สินค้า',unit:'ใบ',stock:120,price:35,cost:18,description:'',createdAt:new Date().toISOString()});
  }
}

async function init(){
  try{
    await initDB();
    const ex=await dbGet('settings','company');
    if(!ex)await dbPut('settings',DEF_SET);
    await seedIfEmpty();
    await repairCounters();
    const set=await getSettings();
    const initial=(set.name||'M').trim().charAt(0).toLowerCase();
    document.querySelectorAll('.tn-mark, .md-head > div:first-child').forEach(el=>el.textContent=initial);
    document.getElementById('tn-brand-name').textContent=set.name;
    document.getElementById('md-name').textContent=set.name;
    setupCreateMenu();
    await refreshNavCounts();
    await navigate('dashboard');
  }catch(e){
    document.getElementById('content').innerHTML='<div class="empty"><div class="empty-i">⚠</div><div class="empty-t">เกิดข้อผิดพลาด</div><div class="empty-s">'+esc(e.message)+'</div></div>';
    console.error(e);
  }
}

// CREATE MENU dropdown
function setupCreateMenu(){
  const menu=document.getElementById('create-menu');
  const items=[
    {label:'ใบเสนอราคา',sub:'Quotation',icon:'quote',color:'var(--quo)',bg:'var(--quo-soft)',fn:openQuotationForm},
    {label:'ใบกำกับภาษี / ใบส่งของ',sub:'Tax Invoice',icon:'invoice',color:'var(--inv)',bg:'var(--inv-soft)',fn:openInvoiceForm},
    {label:'ใบเสร็จรับเงิน',sub:'Receipt',icon:'receipt',color:'var(--rec)',bg:'var(--rec-soft)',fn:openReceiptForm},
    {label:'ใบวางบิล',sub:'Billing Note',icon:'billing',color:'var(--bil)',bg:'var(--bil-soft)',fn:openBillingForm},
    {label:'ใบวางบิลรวม',sub:'Combined',icon:'billings',color:'var(--blc)',bg:'var(--blc-soft)',fn:openBillingCombinedForm},
  ];
  menu.innerHTML='';
  items.forEach(it=>{
    const d=document.createElement('div');
    d.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;cursor:pointer;transition:background var(--t-fast)';
    d.onmouseover=()=>d.style.background='var(--paper-3)';
    d.onmouseout=()=>d.style.background='';
    d.innerHTML='<div style="width:30px;height:30px;border-radius:7px;background:'+it.bg+';color:'+it.color+';display:flex;align-items:center;justify-content:center">'+I[it.icon]+'</div>'
      +'<div style="flex:1"><div style="font-size:13px;font-weight:600;line-height:1.3">'+it.label+'</div><div style="font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;font-weight:500">'+it.sub+'</div></div>';
    d.addEventListener('mousedown',e=>{e.preventDefault();closeCreateMenu();setTimeout(it.fn,40);});
    menu.appendChild(d);
  });
}
function toggleCreateMenu(){
  const m=document.getElementById('create-menu');
  if(m.style.display==='none'){m.style.display='block';setTimeout(()=>document.addEventListener('click',_outsideCreate),10);}
  else closeCreateMenu();
}
function closeCreateMenu(){const m=document.getElementById('create-menu');if(m){m.style.display='none';document.removeEventListener('click',_outsideCreate);}}
function _outsideCreate(e){if(!e.target.closest('#create-wrap'))closeCreateMenu();}

function toggleMobDrawer(){document.getElementById('mob-drawer').classList.toggle('open');document.getElementById('mob-ov').classList.toggle('open');}
function closeMobDrawer(){document.getElementById('mob-drawer').classList.remove('open');document.getElementById('mob-ov').classList.remove('open');}

init();
</script>
</body>
</html>
