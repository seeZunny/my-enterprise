<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
<div id="toaster"></div>
<div id="mob-ov" class="mob-ov" onclick="closeSidebar()"></div>

<div id="app">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sb-brand">
      <div class="sb-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h8M8 17h5"/></svg>
      </div>
      <div style="min-width:0">
        <div class="sb-name" id="sb-name">My Enterprise</div>
        <div class="sb-sub">ระบบออกเอกสารธุรกิจ</div>
      </div>
    </div>
    <div class="sb-nav" id="sb-nav"></div>
    <div class="sb-foot">
      <div class="sb-cmdk" onclick="openCmdK()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span>ค้นหา หรือสั่งการ</span>
        <span class="sb-cmdk-kbd">⌘K</span>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div id="main">
    <header id="topbar">
      <div class="tb-left">
        <button class="hamburger" onclick="toggleSidebar()" aria-label="menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="tb-crumb" id="tb-crumb"><b>ภาพรวม</b></div>
      </div>
      <div class="tb-actions" id="tb-actions"></div>
    </header>
    <main id="content">
      <div style="padding:60px;text-align:center;color:var(--text-3)">
        <div class="spin" style="width:24px;height:24px;border-width:3px"></div>
        <div style="margin-top:12px">กำลังโหลด...</div>
      </div>
    </main>
  </div>
</div>

<script src="icons.js"></script>
<script src="core.js"></script>
<script src="forms.js"></script>
<script src="print.js"></script>
<script src="app.js"></script>
<script src="cmdk.js"></script>
<script>
// ============================================================
// REPAIR + INIT
// ============================================================
async function repairCounters(){
  const thYear=new Date().getFullYear()+543;
  for(const type of ['quotation','invoice','receipt','billing']){
    const realMax=await getMaxDocCount(type,thYear);
    const ctr=await dbGet('doc_counters',type);
    if(!ctr||ctr.year!==thYear||ctr.count!==realMax){
      await dbPut('doc_counters',{type,count:realMax,year:thYear});
    }
  }
}

async function seedIfEmpty(){
  // seed a couple of sample customers + inventory if completely empty,
  // to give the user a starting point
  const[c,i]=await Promise.all([dbAll('customers'),dbAll('inventory')]);
  if(c.length===0){
    await dbAdd('customers',{name:'บริษัท ตัวอย่าง จำกัด',taxId:'0105561234567',address:'123 ถ.พระราม 4 แขวงทุ่งมหาเมฆ เขตสาทร กรุงเทพ 10120',phone:'02-000-0000',email:'sample@example.com',note:'',createdAt:new Date().toISOString()});
    await dbAdd('customers',{name:'ห้างหุ้นส่วน พันธมิตร จำกัด',taxId:'0103564002345',address:'456 ถ.สุขุมวิท 21 แขวงคลองเตยเหนือ เขตวัฒนา กรุงเทพ 10110',phone:'02-111-2222',email:'partner@example.com',note:'',createdAt:new Date().toISOString()});
  }
  if(i.length===0){
    await dbAdd('inventory',{name:'บริการที่ปรึกษา (รายชั่วโมง)',sku:'CON-HR',category:'บริการ',unit:'ชม.',stock:999,price:1500,cost:0,description:'',createdAt:new Date().toISOString()});
    await dbAdd('inventory',{name:'ค่าออกแบบกราฟิก',sku:'DSG-01',category:'บริการ',unit:'งาน',stock:999,price:8500,cost:0,description:'',createdAt:new Date().toISOString()});
    await dbAdd('inventory',{name:'กล่องบรรจุภัณฑ์ ขนาด M',sku:'PKG-M',category:'สินค้า',unit:'ใบ',stock:120,price:35,cost:18,description:'',createdAt:new Date().toISOString()});
  }
}

async function init(){
  try{
    await initDB();
    const ex=await dbGet('settings','company');
    if(!ex)await dbPut('settings',DEF_SET);
    await seedIfEmpty();
    await repairCounters();
    // update brand
    const set=await getSettings();
    document.getElementById('sb-name').textContent=set.name;
    await refreshNavCounts();
    await navigate('dashboard');
  }catch(e){
    document.getElementById('content').innerHTML='<div class="empty" style="padding:80px"><div class="empty-i">⚠</div><div class="empty-t">เกิดข้อผิดพลาด</div><div class="empty-s">'+esc(e.message)+'</div></div>';
    console.error(e);
  }
}
init();

// re-render sidebar counts after any list page nav (light touch)
const _origNav=navigate;
window.navigate=async function(p){
  await _origNav(p);
  refreshNavCounts();
};
</script>
</body>
</html>
